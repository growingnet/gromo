[project]
name = "gromo"
dynamic = ["version"]
authors = [
    { name="Théo Rudkiewicz" },
    { name="Manon Verbockhaven" },
    { name="Stella Douka" },
    { name="Maxence Tekou" },
    { name="Ying Jin" },
    { name="Hugo Mousset" },
    { name="Félix Houdouin" },
    { name="Léo Burgund" },
    { name="Stéphane Rivaud" },
    { name="Alex Davey" },
    { name="François Landes" },
    { name="Guillaume Charpiat" },
    { name="Sylvain Chevallier" },
]
maintainers = [
    { name="Sylvain Chevallier", email="sylvain.a.chevallier@inria.fr" },
]
description = "Growing module for pytorch"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENCE.md"]
requires-python = ">=3.11"
keywords = ["pytorch", "deep learning", "growing neural networks", "neural architecture growth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "networkx",
    "torch",
    "numpy",
    "deprecated",
    "torchmetrics",
]

[project.urls]
Homepage = "https://growingnet.github.io/gromo/"
Documentation = "https://growingnet.github.io/gromo/"
Source = "https://github.com/growingnet/gromo"
Issues = "https://github.com/growingnet/gromo/issues"
Changelog = "https://growingnet.github.io/gromo/whats_new.html"

[project.optional-dependencies]
test = ["coverage"]
dev = ["ruff", "pre-commit", "pydoclint"]
doc = [
    "pre-commit",
    "ruff",
    "Sphinx",
    "sphinx-gallery",
    "sphinx-bootstrap-theme",
    "pydata-sphinx-theme",
    "numpydoc",
    # "m2r2",
    "sphinx-design",
    "sphinx-rtd-theme",
    "sphinx_copybutton",
    "sphinxcontrib-bibtex",
    "sphinx-favicon",
    "matplotlib",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gromo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gromo"]

[tool.hatch.build.targets.sdist]
include = ["src/gromo", "tests", "README.md", "LICENCE.md", "CITATION.cff"]

[tool.coverage.run]
branch = true
include = [
    "src/*",
]
omit = [
    "**/__init__.py",
    "**/tests/**",
]

[tool.coverage.report]
exclude_also = [
    # Missing debug-only code
    "def __str__",
    "def __repr__",
    "if self\\.debug",
    "if verbose:",

    # Non-runnable code
    "if 0:",
    "if __name__ == .__main__.:",
    "pass",

    # Abstract methods
    "@(abc\\.)?abstractmethod",

    # Defensive assertion code
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
# Enable basic linting rules with type-related checks
select = [
    # "ERA", # no commented code
    # "ANN", # flake8-annotations (basic type checking)
    "BLE",   # blind except
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    # "EM",  # flake8-errmsg
    "FA",    # flake8-future-annotations
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "PYI",   # flake8-pyi (stub files)
    "F",     # Pyflakes
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "N",     # pep8-naming
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    # "UP",  # pyupgrade
    "RUF",   # Ruff-specific rules
    # "DOC",  # pydoclint
    "D",     # pydocstyle (docstring style)
]

# Ignore some rules that might be too strict for existing codebase
ignore = [
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "COM819",  # Trailing comma prohibited (conflicts with formatter)
    "C408",    # can initialise dict with dict(...)
    "SIM102",  # forces non-nested if statements
    "SIM108",  # leads to decrease the actual coverage
    "SIM117",  # nested with statements
    "N802",    # function name should be lowercase
    "N803",    # argument name should be lowercase
    "N806",    # argument name should be lowercase
    "E731",    # do not assign a lambda expression, use a def
    "E501",    # line too long
    "B007",    # flake8-bugbear: loop control variable used in closure
    "B008",    # flake8-bugbear: call in default argument
    "B028",    # flake8-bugbear: no explicit stacklevel
    "B006",    # flake8-bugbear: mutable argument as default
    "B018",    # flake8-bugbear: useless expression
    "D100", "D105", "D200", "D205", "D400", "D401",
]

[tool.ruff.lint.per-file-ignores]
# Tests can have more relaxed type checking
"tests/**/*.py" = ["ANN", "ARG", "D"]
# Examples can ignore type annotations
"examples/**/*.py" = ["ANN", "D"]
# Init files can ignore unused imports
"**/__init__.py" = ["F401"]
# Docs can ignore various linting rules
"docs/**/*.py" = ["ANN", "ARG", "D", "A", "BLE", "ICN"]

[tool.ruff.format]
# Use same formatting as black
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"
