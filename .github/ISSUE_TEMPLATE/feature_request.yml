name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem would this feature solve, or what would it make possible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could it work? A sketch of the API is welcome.
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related papers, libraries or alternatives you considered.
