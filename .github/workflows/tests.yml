name: Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: dev ${{ matrix.os }}, py-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # windows-latest, macOS-latest -> problem with MAGMA/CUDA 12.1
        os: [ ubuntu-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: pre-commit/action@v3.0.1
        env:
          # Skip no-commit-to-branch in CI (push and pull_request); enforce it only in local dev.
          SKIP: no-commit-to-branch

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run tests
        run: |
          coverage run -m unittest
          coverage xml
          coverage report -m

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: codecov-ci-gromo
          verbose: true
          # Optional: the organization accepts tokenless uploads (forks, Dependabot).
          token: ${{ secrets.CODECOV2_TOKEN }}
