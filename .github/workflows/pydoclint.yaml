name: Documentation Linting
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pydoclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run the pydoclint hook of .pre-commit-config.yaml, so that CI and local
      # checks use the same pinned pydoclint version.
      - name: Run pydoclint
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: pydoclint --all-files
